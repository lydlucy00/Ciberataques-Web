<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sector Asia - Monitor Global Táctico</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #010409; font-family: 'Inter', sans-serif; color: #f3f4f6; user-select: none; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(10, 15, 29, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 1rem; }
        @media (max-width: 768px) {
            .mobile-stack { flex-direction: column !important; justify-content: flex-end !important; }
            aside { width: 100% !important; max-height: 35vh !important; }
        }
    </style>
</head>
<body class="w-screen h-screen">
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <div class="relative z-10 w-full h-full pointer-events-none p-3 md:p-6 flex flex-col justify-between">
        <header class="flex flex-wrap justify-between items-center w-full gap-2">
            <div class="glass-panel pointer-events-auto px-4 py-2 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
                <span class="text-xs font-bold uppercase text-cyan-400 font-mono">SECTOR ASIA: MULTI-AMENAZA</span>
            </div>
            
            <nav class="glass-panel pointer-events-auto px-3 py-1.5 flex items-center gap-1.5 text-xs">
                <a href="index.html" class="px-2.5 py-1 rounded-lg text-white/70 hover:text-white">Global</a>
                <a href="europa.html" class="px-2.5 py-1 rounded-lg text-white/70 hover:text-white">Europa</a>
                <a href="america.html" class="px-2.5 py-1 rounded-lg text-white/70 hover:text-white">América</a>
                <a href="asia.html" class="px-2.5 py-1 rounded-lg bg-cyan-500/20 text-cyan-400 font-bold border border-cyan-500/30">Asia</a>
                <a href="ranking.html" class="px-2.5 py-1 rounded-lg text-amber-400 hover:bg-amber-500/10 border border-amber-500/20">Ranking Países</a>
                <a href="docs.html" class="px-2.5 py-1 rounded-lg text-cyan-300">Docs</a>
            </nav>
        </header>

        <div class="flex-1 flex mobile-stack justify-between items-stretch my-2 gap-3 overflow-hidden">
            <aside class="glass-panel pointer-events-auto w-full md:w-80 flex flex-col p-4 space-y-3 overflow-y-auto">
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-cyan-400 border-b border-white/10 pb-1.5 font-mono">VECTORES ACTIVOS (ASIA)</h2>
                    <div id="attack-feed" class="space-y-1.5 text-xs font-mono overflow-y-auto max-h-36 md:max-h-48 mt-2"></div>
                </div>

                <!-- CIUDADES MÁS AFECTADAS (ASIA) -->
                <div class="pt-2 border-t border-white/10 space-y-1.5">
                    <h3 class="text-[10px] font-bold uppercase tracking-wider text-white/50 font-mono">Capitales Más Afectadas</h3>
                    <div class="space-y-1 text-xs font-mono">
                        <div class="flex justify-between items-center bg-white/5 p-1.5 rounded border border-white/5">
                            <span class="text-white/90">1. Tokio (Japón)</span>
                            <span class="text-red-400 font-bold text-[10px]">112.3k atks</span>
                        </div>
                        <div class="flex justify-between items-center bg-white/5 p-1.5 rounded border border-white/5">
                            <span class="text-white/90">2. Dubái (EAU)</span>
                            <span class="text-red-400 font-bold text-[10px]">95.7k atks</span>
                        </div>
                        <div class="flex justify-between items-center bg-white/5 p-1.5 rounded border border-white/5">
                            <span class="text-white/90">3. Singapur (Singapur)</span>
                            <span class="text-amber-400 font-bold text-[10px]">83.4k atks</span>
                        </div>
                        <div class="flex justify-between items-center bg-white/5 p-1.5 rounded border border-white/5">
                            <span class="text-white/90">4. Seúl (Corea del Sur)</span>
                            <span class="text-cyan-400 font-bold text-[10px]">71.0k atks</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        const EARTH_RADIUS = 5;
        let scene, camera, renderer, controls, earthMesh;
        let activeProjectiles = [];
        const CITIES = [
            { name: "Tokio", lat: 35.6762, lon: 139.6503 },
            { name: "Singapur", lat: 1.3521, lon: 103.8198 },
            { name: "Seúl", lat: 37.5665, lon: 126.9780 },
            { name: "Pekín", lat: 39.9042, lon: 116.4074 },
            { name: "Dubái", lat: 25.2048, lon: 55.2708 },
            { name: "Mumbai", lat: 19.0760, lon: 72.8777 }
        ];
        const ATTACKS = [
            { type: "DDoS MASIVO", color: 0xef4444, css: "text-red-400" },
            { type: "RANSOMWARE", color: 0xf59e0b, css: "text-amber-400" },
            { type: "SQL INJECTION", color: 0x06b6d4, css: "text-cyan-400" },
            { type: "MALWARE APT", color: 0xa855f7, css: "text-purple-400" }
        ];

        window.addEventListener('load', () => {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(-8, 2, -7);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const dayTex = new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
            earthMesh = new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS, 64, 64), new THREE.MeshBasicMaterial({ map: dayTex }));
            scene.add(earthMesh);

            animate();
            setInterval(spawnAttack, 350);
        });

        function getVector(lat, lon, alt) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            return new THREE.Vector3(-(alt * Math.sin(phi) * Math.cos(theta)), alt * Math.cos(phi), alt * Math.sin(phi) * Math.sin(theta));
        }

        function spawnAttack() {
            const origin = CITIES[Math.floor(Math.random() * CITIES.length)];
            let target = CITIES[Math.floor(Math.random() * CITIES.length)];
            while(target === origin) target = CITIES[Math.floor(Math.random() * CITIES.length)];

            const atk = ATTACKS[Math.floor(Math.random() * ATTACKS.length)];
            const start = getVector(origin.lat, origin.lon, EARTH_RADIUS + 0.02);
            const end = getVector(target.lat, target.lon, EARTH_RADIUS + 0.02);
            const mid = start.clone().add(end).multiplyScalar(0.5).normalize().multiplyScalar(EARTH_RADIUS + 0.8);

            const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
            const proj = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), new THREE.MeshBasicMaterial({ color: atk.color }));
            scene.add(proj);

            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(25)), new THREE.LineBasicMaterial({ color: atk.color, transparent: true, opacity: 0.8 }));
            scene.add(line);

            activeProjectiles.push({ curve, progress: 0, speed: 0.04, mesh: proj, line, targetPos: end, color: atk.color });

            const feed = document.getElementById('attack-feed');
            const item = document.createElement('div');
            item.className = "p-1.5 bg-white/5 rounded border border-white/5 flex justify-between";
            item.innerHTML = `<span>${origin.name} ➔ ${target.name}</span><span class="${atk.css} font-bold">${atk.type}</span>`;
            feed.insertBefore(item, feed.firstChild);
            if(feed.children.length > 5) feed.removeChild(feed.lastChild);
        }

        function animate() {
            requestAnimationFrame(animate);
            if(earthMesh) earthMesh.rotation.y += 0.0006;

            for(let i = activeProjectiles.length - 1; i >= 0; i--) {
                let p = activeProjectiles[i];
                p.progress += p.speed;
                if(p.progress >= 1) {
                    scene.remove(p.mesh); scene.remove(p.line);
                    p.mesh.geometry.dispose(); p.line.geometry.dispose();
                    activeProjectiles.splice(i, 1);
                } else {
                    p.mesh.position.copy(p.curve.getPoint(p.progress));
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
