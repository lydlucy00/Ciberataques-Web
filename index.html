<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global CyberThreat SOC 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #010409; font-family: 'Inter', sans-serif; color: #f3f4f6; user-select: none; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel {
            background: rgba(8, 12, 24, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 1rem;
        }
        .live-dot { animation: pulse 1s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.8); } }
        @media (max-width: 768px) {
            .mobile-stack { flex-direction: column !important; justify-content: flex-end !important; }
            aside { width: 100% !important; max-height: 25vh !important; }
        }
    </style>
</head>
<body class="w-screen h-screen">
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <div class="relative z-10 w-full h-full pointer-events-none p-3 md:p-6 flex flex-col justify-between">
        <!-- Cabecera NAVEGACIÓN -->
        <header class="flex flex-wrap justify-between items-center w-full gap-2">
            <div class="glass-panel pointer-events-auto px-4 py-2 flex items-center gap-3">
                <span class="w-3 h-3 rounded-full bg-red-500 live-dot"></span>
                <span class="text-xs font-bold uppercase text-red-400 font-mono tracking-widest">RADAR TÁCTICO 3D</span>
            </div>
            
            <nav class="glass-panel pointer-events-auto px-3 py-1.5 flex items-center gap-1.5 text-xs">
                <a href="index.html" class="px-2.5 py-1 rounded-lg bg-red-500/20 text-red-400 font-bold border border-red-500/30">Global</a>
                <a href="europa.html" class="px-2.5 py-1 rounded-lg text-white/70 hover:text-white">Europa</a>
                <a href="america.html" class="px-2.5 py-1 rounded-lg text-white/70 hover:text-white">América</a>
                <a href="asia.html" class="px-2.5 py-1 rounded-lg text-white/70 hover:text-white">Asia</a>
                <a href="ranking.html" class="px-2.5 py-1 rounded-lg text-amber-400 hover:bg-amber-500/10 border border-amber-500/20">Ranking Países</a>
                <a href="docs.html" class="px-2.5 py-1 rounded-lg text-cyan-300">Docs</a>
            </nav>
        </header>

        <!-- Feed Táctico y Panel de Alertas Dinámico -->
        <div class="flex-1 flex mobile-stack justify-between items-stretch my-2 gap-3 overflow-hidden">
            <aside class="glass-panel pointer-events-auto w-full md:w-80 flex flex-col p-4 space-y-3 overflow-y-auto">
                <!-- PANEL DINÁMICO DE NIVEL DE ALERTA -->
                <div class="bg-white/5 p-3 rounded-xl border border-white/10 space-y-1">
                    <div class="flex justify-between items-center text-[10px] font-mono text-white/50 uppercase">
                        <span>Nivel de Alerta Global</span>
                        <span id="threat-count" class="text-white/80 font-bold">0 ATKS/SEC</span>
                    </div>
                    <div id="alert-status-badge" class="flex items-center justify-between p-2 rounded-lg bg-emerald-500/20 border border-emerald-500/40 transition-all duration-500">
                        <span id="alert-status-text" class="text-xs font-bold font-mono text-emerald-400 tracking-wider">NIVEL 4 - BAJO</span>
                        <span id="alert-status-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                    </div>
                </div>

                <h2 class="text-xs font-bold uppercase tracking-wider text-red-400 border-b border-white/10 pb-2 font-mono flex justify-between">
                    <span>IMPACTOS EN TIEMPO REAL</span>
                    <span class="animate-pulse">LIVE</span>
                </h2>
                <div id="attack-feed" class="space-y-1.5 text-xs font-mono overflow-y-auto max-h-48 md:max-h-64"></div>
            </aside>
        </div>
    </div>

    <script>
        const EARTH_RADIUS = 5;
        let scene, camera, renderer, controls, earthMesh, particlesMesh;
        let activeProjectiles = [];
        let shockwaves = [];
        let attacksThisSecond = 0;

        const CITIES = [
            { name: "Madrid", lat: 40.4168, lon: -3.7038 },
            { name: "Washington D.C.", lat: 38.9072, lon: -77.0369 },
            { name: "Tokio", lat: 35.6762, lon: 139.6503 },
            { name: "Londres", lat: 51.5074, lon: -0.1278 },
            { name: "Sídney", lat: -33.8688, lon: 151.2093 },
            { name: "São Paulo", lat: -23.5505, lon: -46.6333 },
            { name: "Singapur", lat: 1.3521, lon: 103.8198 },
            { name: "Frankfurt", lat: 50.1109, lon: 8.6821 },
            { name: "Seúl", lat: 37.5665, lon: 126.9780 },
            { name: "Tel Aviv", lat: 32.0853, lon: 34.7818 }
        ];

        const ATTACKS = [
            { type: "RANSOMWARE CRÍTICO", color: 0xef4444, css: "text-red-400" },
            { type: "INYECCIÓN CERO-DAY", color: 0xf59e0b, css: "text-amber-400" },
            { type: "DDOS MASIVO", color: 0x06b6d4, css: "text-cyan-400" },
            { type: "ESPIONAJE APT", color: 0xa855f7, css: "text-purple-400" }
        ];

        window.addEventListener('load', () => {
            initScene();
            createSpace();
            createEarth();
            animate();
            
            // Intervalo variable aleatorio para simular ráfagas de ciberataques
            scheduleNextAttack();

            // Actualizar nivel de alerta cada segundo
            setInterval(updateThreatLevel, 1000);
        });

        function scheduleNextAttack() {
            spawnExplosiveAttack();
            attacksThisSecond++;
            // Aleatorizar tiempo entre 150ms y 500ms para crear fluctuaciones de tráfico
            const nextDelay = Math.floor(Math.random() * 350) + 150;
            setTimeout(scheduleNextAttack, nextDelay);
        }

        function initScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
        }

        function createSpace() {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(3000 * 3);
            for(let i=0; i<9000; i++) pos[i] = (Math.random() - 0.5) * 250;
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            particlesMesh = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.6, color: 0x38bdf8, transparent: true, opacity: 0.4 }));
            scene.add(particlesMesh);
        }

        function createEarth() {
            const textureLoader = new THREE.TextureLoader();
            const dayTex = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
            const nightTex = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-night-lights.jpg');

            earthMesh = new THREE.Mesh(
                new THREE.SphereGeometry(EARTH_RADIUS, 64, 64),
                new THREE.ShaderMaterial({
                    uniforms: { dayTexture: { value: dayTex }, nightTexture: { value: nightTex } },
                    vertexShader: `
                        varying vec3 vNormal; varying vec2 vUv;
                        void main() { vUv = uv; vNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
                    `,
                    fragmentShader: `
                        uniform sampler2D dayTexture; uniform sampler2D nightTexture;
                        varying vec3 vNormal; varying vec2 vUv;
                        void main() {
                            vec3 day = texture2D(dayTexture, vUv).rgb * 0.25;
                            vec3 night = texture2D(nightTexture, vUv).rgb * vec3(1.5, 0.7, 0.7) * 3.5;
                            gl_FragColor = vec4(day + night, 1.0);
                        }
                    `
                })
            );
            scene.add(earthMesh);
        }

        function getVector(lat, lon, alt) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            return new THREE.Vector3(-(alt * Math.sin(phi) * Math.cos(theta)), alt * Math.cos(phi), alt * Math.sin(phi) * Math.sin(theta));
        }

        function spawnExplosiveAttack() {
            const origin = CITIES[Math.floor(Math.random() * CITIES.length)];
            let target = CITIES[Math.floor(Math.random() * CITIES.length)];
            while(target === origin) target = CITIES[Math.floor(Math.random() * CITIES.length)];

            const atk = ATTACKS[Math.floor(Math.random() * ATTACKS.length)];
            const start = getVector(origin.lat, origin.lon, EARTH_RADIUS + 0.02);
            const end = getVector(target.lat, target.lon, EARTH_RADIUS + 0.02);
            const mid = start.clone().add(end).multiplyScalar(0.5).normalize().multiplyScalar(EARTH_RADIUS + 1.2);

            const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
            
            const projGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const projMat = new THREE.MeshBasicMaterial({ color: atk.color });
            const projectile = new THREE.Mesh(projGeo, projMat);
            scene.add(projectile);

            const lineMat = new THREE.LineBasicMaterial({ color: atk.color, transparent: true, opacity: 0.8 });
            const lineGeo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(30));
            const line = new THREE.Line(lineGeo, lineMat);
            scene.add(line);

            activeProjectiles.push({
                curve: curve, progress: 0, speed: 0.035,
                mesh: projectile, line: line, targetPos: end, color: atk.color
            });

            const feed = document.getElementById('attack-feed');
            const item = document.createElement('div');
            item.className = "p-1.5 bg-white/5 rounded border border-white/5 flex justify-between items-center";
            item.innerHTML = `<span class="truncate max-w-[140px]">${origin.name} ➔ ${target.name}</span><span class="${atk.css} font-bold">${atk.type}</span>`;
            feed.insertBefore(item, feed.firstChild);
            if(feed.children.length > 7) feed.removeChild(feed.lastChild);
        }

        function createShockwave(position, colorHex) {
            const waveGeo = new THREE.RingGeometry(0.02, 0.05, 32);
            const waveMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 1 });
            const wave = new THREE.Mesh(waveGeo, waveMat);
            
            wave.position.copy(position);
            wave.lookAt(new THREE.Vector3(0,0,0));
            scene.add(wave);

            shockwaves.push({ mesh: wave, scale: 1, opacity: 1 });
        }

        // LÓGICA DEL NIVEL DE ALERTA DINÁMICO
        function updateThreatLevel() {
            const countElem = document.getElementById('threat-count');
            const badgeElem = document.getElementById('alert-status-badge');
            const textElem = document.getElementById('alert-status-text');
            const dotElem = document.getElementById('alert-status-dot');

            const currentRate = attacksThisSecond * 25 + activeProjectiles.length; // Cálculo ponderado de nivel
            countElem.innerText = `${attacksThisSecond * 14} ATKS/SEC`;
            attacksThisSecond = 0; // Reset contador del segundo

            if (currentRate > 90) {
                // DEFCON 1 / CRÍTICO
                badgeElem.className = "flex items-center justify-between p-2 rounded-lg bg-red-500/30 border border-red-500/60 animate-pulse";
                textElem.className = "text-xs font-bold font-mono text-red-400 tracking-wider";
                textElem.innerText = "DEFCON 1 - CRÍTICO";
                dotElem.className = "w-2.5 h-2.5 rounded-full bg-red-500 animate-ping";
            } else if (currentRate > 60) {
                // ALTO
                badgeElem.className = "flex items-center justify-between p-2 rounded-lg bg-orange-500/25 border border-orange-500/50";
                textElem.className = "text-xs font-bold font-mono text-orange-400 tracking-wider";
                textElem.innerText = "DEFCON 2 - ALTO";
                dotElem.className = "w-2.5 h-2.5 rounded-full bg-orange-500 animate-ping";
            } else if (currentRate > 35) {
                // MEDIO
                badgeElem.className = "flex items-center justify-between p-2 rounded-lg bg-amber-500/20 border border-amber-500/40";
                textElem.className = "text-xs font-bold font-mono text-amber-400 tracking-wider";
                textElem.innerText = "DEFCON 3 - MEDIO";
                dotElem.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse";
            } else {
                // BAJO
                badgeElem.className = "flex items-center justify-between p-2 rounded-lg bg-emerald-500/20 border border-emerald-500/40";
                textElem.className = "text-xs font-bold font-mono text-emerald-400 tracking-wider";
                textElem.innerText = "DEFCON 4 - NORMAL";
                dotElem.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping";
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if(earthMesh) earthMesh.rotation.y += 0.0008;
            if(particlesMesh) particlesMesh.rotation.y += 0.0002;

            for(let i = activeProjectiles.length - 1; i >= 0; i--) {
                let p = activeProjectiles[i];
                p.progress += p.speed;
                if(p.progress >= 1) {
                    createShockwave(p.targetPos, p.color);
                    scene.remove(p.mesh);
                    scene.remove(p.line);
                    p.mesh.geometry.dispose();
                    p.line.geometry.dispose();
                    activeProjectiles.splice(i, 1);
                } else {
                    p.mesh.position.copy(p.curve.getPoint(p.progress));
                }
            }

            for(let i = shockwaves.length - 1; i >= 0; i--) {
                let w = shockwaves[i];
                w.scale += 0.15;
                w.opacity -= 0.04;
                w.mesh.scale.set(w.scale, w.scale, w.scale);
                w.mesh.material.opacity = w.opacity;
                if(w.opacity <= 0) {
                    scene.remove(w.mesh);
                    w.mesh.geometry.dispose();
                    w.mesh.material.dispose();
                    shockwaves.splice(i, 1);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
